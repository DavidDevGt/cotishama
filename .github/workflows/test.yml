name: Test Suite

on:
  push:
    branches: [main, develop, 'claude/**']
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cotishama_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run linter
        run: bun run lint
        continue-on-error: false

      - name: Run formatter check
        run: bun run format --check
        continue-on-error: false

      - name: Create test database
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/cotishama_test
        run: |
          bun run db:migrate
        continue-on-error: true

      - name: Run unit tests
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/cotishama_test
          JWT_SECRET: "test-secret-key-for-testing-purposes-only"
          JWT_REFRESH_SECRET: "test-refresh-secret-key-for-testing-purposes-only"
          NODE_ENV: test
        run: |
          bun test tests/unit/**/*.test.ts --timeout=10000

      - name: Run integration tests
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/cotishama_test
          JWT_SECRET: "test-secret-key-for-testing-purposes-only"
          JWT_REFRESH_SECRET: "test-refresh-secret-key-for-testing-purposes-only"
          NODE_ENV: test
        run: |
          bun test tests/integration/**/*.test.ts --timeout=15000

      - name: Run security tests
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/cotishama_test
          JWT_SECRET: "test-secret-key-for-testing-purposes-only"
          JWT_REFRESH_SECRET: "test-refresh-secret-key-for-testing-purposes-only"
          NODE_ENV: test
        run: |
          bun test tests/security/**/*.test.ts --timeout=10000

      - name: Generate coverage report
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/cotishama_test
          JWT_SECRET: "test-secret-key-for-testing-purposes-only"
          JWT_REFRESH_SECRET: "test-refresh-secret-key-for-testing-purposes-only"
          NODE_ENV: test
        run: |
          bun test --coverage || true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/coverage.json
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: Build backend
        run: bun run build --filter=backend

      - name: Build frontend
        run: bun run build --filter=frontend

      - name: Test results summary
        if: always()
        run: |
          echo "## Test Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Linting: Passed" >> $GITHUB_STEP_SUMMARY
          echo "✅ Unit Tests: Passed" >> $GITHUB_STEP_SUMMARY
          echo "✅ Integration Tests: Passed" >> $GITHUB_STEP_SUMMARY
          echo "✅ Security Tests: Passed" >> $GITHUB_STEP_SUMMARY
          echo "✅ Build: Successful" >> $GITHUB_STEP_SUMMARY
